<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="tictactoestyle.css">
</head>

<body>

    <main class="game-container">

        <header class="game-header">
            <p class="eyebrow">2 PLAYER GAME</p>
            <h1>TIC TAC <span>TOE</span></h1>
            <p id="status">Player X's turn</p>
        </header>

        <section class="scoreboard">
            <div class="score-card x-score">
                <span class="player-symbol">X</span>
                <div>
                    <small>PLAYER X</small>
                    <strong id="scoreX">0</strong>
                </div>
            </div>

            <div class="score-card draw-score">
                <span class="player-symbol">=</span>
                <div>
                    <small>DRAWS</small>
                    <strong id="scoreDraw">0</strong>
                </div>
            </div>

            <div class="score-card o-score">
                <span class="player-symbol">O</span>
                <div>
                    <small>PLAYER O</small>
                    <strong id="scoreO">0</strong>
                </div>
            </div>
        </section>

        <section class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </section>

        <div class="game-message" id="gameMessage">
            <div class="message-icon">★</div>
            <h2 id="messageTitle">Player X Wins!</h2>
            <p id="messageText">Excellent move.</p>
        </div>

        <section class="controls">
            <button class="control-btn restart-btn" id="restartBtn">
                <span>↻</span>
                Restart Game
            </button>

            <button class="control-btn reset-btn" id="resetScoreBtn">
                Reset Score
            </button>
        </section>

        <footer>
            <span>BUILT WITH</span>
            <strong>HTML</strong>
            <strong>CSS</strong>
            <strong>JAVASCRIPT</strong>
        </footer>

    </main>

    <script src="tictactoescript.js"></script>

</body>
</html>
